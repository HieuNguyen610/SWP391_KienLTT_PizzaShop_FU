<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .co-container { max-width: 1100px; margin: 24px auto; padding: 0 16px; display:grid; grid-template-columns: 1fr 360px; gap: 16px; }
        .co-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
        .co-title { font-size: 1.6rem; font-weight: 800; text-align:center; margin-bottom: 12px; }
        .co-section { margin-bottom: 16px; }
        .co-section h3 { margin:0 0 8px; font-size:1.1rem; }
        .co-field { margin-bottom: 10px; }
        .co-field label { display:block; font-weight:600; margin-bottom:6px; }
        .co-field input, .co-field textarea, .co-field select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; }
        .co-actions { display:flex; gap:10px; justify-content:flex-end; margin-top: 12px; }
        .btn { background:#db2d2c; color:#fff; border:none; border-radius:8px; padding:10px 14px; text-decoration:none; cursor:pointer; font-weight:700; }
        .btn.secondary { background:#6b7280; }
        .co-summary { position: sticky; top: 16px; align-self:start; }
        .co-summary .row { display:flex; justify-content:space-between; margin:6px 0; }
        .co-summary .total { font-size: 1.4rem; font-weight:800; }
        .muted { color:#6b7280; }
        @media (max-width: 960px){ .co-container{ grid-template-columns: 1fr; } .co-summary{ position: static; } }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: page_header}"></div>

<main>
    <h1 class="co-title">Checkout</h1>

    <div class="co-container">
        <!-- Left: Info -->
        <div>
            <div class="co-card co-section">
                <h3>Pickup location</h3>
                <div class="muted" th:text="${address.addressLine}">Store / delivery address</div>
                <div class="co-field">
                    <label for="co-notes">Notes</label>
                    <textarea id="co-notes" rows="3" placeholder="Order notes..." maxlength="200"></textarea>
                </div>
                <div class="co-field">
                    <label for="co-time">Pickup time</label>
                    <select id="co-time">
                        <option>Immediate</option>
                        <option>Within 30 minutes</option>
                        <option>Within 1 hour</option>
                    </select>
                </div>
            </div>

            <div class="co-card co-section">
                <h3>Customer</h3>
                <div class="co-field">
                    <label for="co-name">Full name</label>
                    <input id="co-name" type="text" th:value="${user != null ? (user.firstname + ' ' + user.lastname) : ''}" placeholder="Enter full name" />
                </div>
                <div class="co-field">
                    <label for="co-phone">Phone number</label>
                    <input id="co-phone" type="tel" th:value="${contactPhone}" placeholder="Enter phone number" />
                </div>
                <div class="co-field">
                    <label for="co-email">Email</label>
                    <input id="co-email" type="email" th:value="${user != null ? user.email : ''}" placeholder="Enter email" />
                </div>
            </div>

            <div class="co-card co-section">
                <h3>Payment method</h3>
                <div class="co-field"><label><input type="radio" name="pay" checked /> Cash</label></div>
                <div class="co-field"><label><input type="radio" name="pay" /> Bank transfer</label></div>
            </div>
        </div>

        <!-- Right: Summary -->
        <aside class="co-summary co-card">
            <h3>My cart</h3>
            <div class="muted" th:text="${'You have ' + (items != null ? items.size() : 0) + ' items in your cart'}">You have 0 items in your cart</div>
            <hr/>
            <div class="row"><span>Subtotal</span><strong th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</strong></div>
            <div class="row"><span>Member discount</span><span th:text="${#numbers.formatDecimal(memberDiscount, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</span></div>
            <div class="row"><span>Shipping fee</span><span th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span></div>
            <hr/>
            <div class="row total"><span>Total</span><span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span></div>
            <div class="co-field" style="margin-top:12px;">
                <label><input type="checkbox" checked /> I agree to the terms and conditions</label>
            </div>
            <div class="co-actions">
                <a class="btn secondary" th:href="@{/cart}">Back</a>
                <button class="btn" type="button" id="purchase-btn"><a th:href="@{/checkout/pay}">Place order</a></button>
            </div>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>
</body>
</html>
