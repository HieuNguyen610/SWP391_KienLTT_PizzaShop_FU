<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" href="/css/all.min.css" />
</head>
<body>
<div class="container auth-card">
    <h1 class="title">Reset password</h1>
    <p class="subtitle">Create a new password for your account.</p>

    <div th:if="${error}" class="error" th:text="${error}" role="alert"></div>
    <div th:if="${success}" class="success" th:text="${success}" role="status"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" autocomplete="off" novalidate>
        <input type="hidden" th:field="*{token}" />

        <div class="form-group">
            <label for="password">New password</label>
            <div class="password-field">
                <input type="password" th:field="*{password}" id="password" placeholder="Enter new password" required autocomplete="new-password" aria-describedby="pwHelp pwRules" />
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password" aria-pressed="false" data-eye="/images/eye.png" data-eye-slash="/images/eye_2.png">
                    <img th:src="@{/images/eye.png}" src="/images/eye.png" alt="Show" />
                </button>
            </div>

            <div class="strength" aria-hidden="true"><div class="strength-bar" id="pwStrengthBar"></div></div>
            <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
                <input type="password" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password" aria-describedby="matchMsg" />
                <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password" aria-pressed="false" data-eye="/images/eye.png" data-eye-slash="/images/eye_2.png">
                    <img th:src="@{/images/eye.png}" src="/images/eye.png" alt="Show" />
                </button>
            </div>
            <div id="matchMsg" class="pw-match" aria-live="polite"></div>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="field-error" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Update password</button>
        <p class="support">Need help? <a href="mailto:support@pizzashop.local">Email support@pizzashop.local</a></p>
        <p class="bottom-link"><a th:href="@{/login}">Back to login</a></p>
    </form>
</div>

<script>
(function() {
  function setupPasswordToggles() {
    const toggles = document.querySelectorAll('.password-field .toggle-password');
    toggles.forEach(btn => {
      const targetId = btn.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if (!input) return;
      const img = btn.querySelector('img');
      const eye = btn.getAttribute('data-eye');
      const eyeSlash = btn.getAttribute('data-eye-slash');
      btn.addEventListener('click', () => {
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.setAttribute('aria-pressed', String(!showing));
        btn.setAttribute('aria-label', (showing ? 'Show' : 'Hide') + ' password');
        if (img && eye && eyeSlash) {
          img.src = showing ? eye : eyeSlash;
          img.alt = showing ? 'Show' : 'Hide';
        }
      });
    });
  }

  function setupMatchIndicator() {
    const pw = document.getElementById('password');
    const cpw = document.getElementById('confirmPassword');
    const msg = document.getElementById('matchMsg');
    if (!pw || !cpw || !msg) return;
    function check() {
      if (!cpw.value) { msg.textContent=''; msg.classList.remove('ok','bad'); return; }
      if (pw.value === cpw.value) { msg.textContent='Passwords match'; msg.classList.add('ok'); msg.classList.remove('bad'); }
      else { msg.textContent='Passwords do not match'; msg.classList.add('bad'); msg.classList.remove('ok'); }
    }
    pw.addEventListener('input', check);
    cpw.addEventListener('input', check);
  }

  function setupStrengthBar() {
    const pw = document.getElementById('password');
    const bar = document.getElementById('pwStrengthBar');
    if (!pw || !bar) return;
    pw.addEventListener('input', () => {
      const v = pw.value || '';
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[a-z]/.test(v)) score++;
      if (/\d/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const pct = (score / 5) * 100;
      bar.style.width = pct + '%';
      bar.style.background = pct < 40 ? '#d33' : pct < 70 ? '#e67e22' : '#27ae60';
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    setupPasswordToggles();
    setupMatchIndicator();
    setupStrengthBar();
  });
})();
</script>
</body>
</html>
