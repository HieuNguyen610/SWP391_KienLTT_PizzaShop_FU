<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" href="/css/all.min.css" />
</head>
<body>
<div class="container auth-card">
    <h1 class="title">Reset password</h1>
    <p class="subtitle">Create a new password for your account.</p>

    <div th:if="${error}" class="error" th:text="${error}" role="alert"></div>
    <div th:if="${success}" class="success" th:text="${success}" role="status"></div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" autocomplete="off" novalidate>
        <input type="hidden" th:field="*{token}" />

        <div class="form-group">
            <label for="password">New password</label>
            <div class="password-field">
                <input type="password" th:field="*{password}" id="password" placeholder="Enter new password" required autocomplete="new-password" aria-describedby="pwHelp pwRules" />
                <button type="button" class="toggle" data-target="password" aria-label="Show password" data-eye="/images/eye.png" data-eye-slash="/images/eye_2.png">
                    <img th:src="@{/images/eye.png}" src="/images/eye.png" alt="Show" style="width:18px;height:18px;object-fit:contain;" />
                </button>
            </div>

            <div class="strength" aria-hidden="true"><div class="strength-bar" id="pwStrengthBar"></div></div>
            <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
                <input type="password" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password" aria-describedby="matchMsg" />
                <button type="button" class="toggle" data-target="confirmPassword" aria-label="Show password" data-eye="/images/eye.png" data-eye-slash="/images/eye_2.png">
                    <img th:src="@{/images/eye.png}" src="/images/eye.png" alt="Show" style="width:18px;height:18px;object-fit:contain;" />
                </button>
            </div>
            <div id="matchMsg" class="pw-match" aria-live="polite"></div>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="field-error" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Update password</button>
        <p class="support">Need help? <a href="mailto:support@pizzashop.local">Email support@pizzashop.local</a></p>
        <p class="bottom-link"><a th:href="@{/login}">Back to login</a></p>
    </form>
</div>

<script>
</script>
</body>
</html>
