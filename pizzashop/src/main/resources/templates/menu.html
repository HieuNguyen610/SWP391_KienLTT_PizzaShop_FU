<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu - Pizza Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>🍕 Pizza Shop</h1>
    <nav>
        <a href="/">Trang chủ</a>
        <a href="/menu">Menu</a>
        <a href="/cart">Giỏ hàng</a>
        <a href="/contact">Liên hệ</a>
    </nav>
</header>

<main>
    <h2>Menu Pizza</h2>
    <div class="menu-list">
        <!-- Lặp qua danh sách pizza từ DB -->
        <div class="pizza" th:each="pizza : ${pizzas}">
            <h3 th:text="${pizza.name}">Tên pizza</h3>
            <p th:text="'Giá: ' + ${pizza.basePrice} + ' VND'">Giá pizza</p>

            <!-- Form thêm pizza vào giỏ -->
            <form th:action="@{/cart/add/{id}(id=${pizza.id})}" method="post">
                <button type="submit" class="btn">Thêm vào giỏ</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <p>© 2025 Pizza Shop. All rights reserved.</p>
</footer>
</body>
</html>
