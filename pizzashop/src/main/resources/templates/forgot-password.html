<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" href="/css/all.min.css" />
    <style>
        .auth-card { max-width:420px; }
        .subtitle { margin-top:4px; margin-bottom:22px; font-size:.9rem; color:#444; }
        .support { font-size:.75rem; margin-top:12px; }
        .support a { font-weight:600; }
        .btn { width:160px; }
        .form-group { margin-bottom:18px; }
    </style>
</head>
<body>
<div class="container auth-card">
    <h1 class="title">Reset password</h1>
    <p class="subtitle">Submit the email you signed up with to reset your password.</p>

    <div th:if="${success}" class="success" th:text="${success}" role="status"></div>
    <div th:if="${error}" class="error" th:text="${error}" role="alert"></div>

    <form th:action="@{/forgot-password}" th:object="${passwordResetRequestForm}" method="post" autocomplete="off" novalidate>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" th:field="*{email}" id="email" placeholder="you@example.com" required autocomplete="email" />
            <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
        </div>
        <button type="submit" class="btn">Send link</button>
        <p class="support">Have problems? <a href="mailto:support@pizzashop.local">Email to support@pizzashop.local</a></p>
        <p class="bottom-link"><a th:href="@{/login}">Back to login</a></p>
    </form>
</div>
</body>
</html>
