<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayGate - Checkout (Stripe)</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/paygate.css" />
    <script src="https://js.stripe.com/v3"></script>
    <!-- CSRF meta tags (safer access for JS) -->
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <style>
        .stripe-btn { background:#635bff; color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:600; cursor:pointer; }
        .stripe-btn[disabled]{ opacity:.6; cursor:not-allowed; }
        .pg-separator { text-align:center; margin:16px 0; position:relative; }
        .pg-separator:before, .pg-separator:after { content:""; position:absolute; top:50%; width:40%; height:1px; background:#e5e7eb; }
        .pg-separator:before { left:0; } .pg-separator:after { right:0; }
        .pg-separator span { background:#fff; padding:0 12px; color:#6b7280; font-size:.85rem; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: page_header}"></div>

<main class="pg-wrap">
    <div class="pg-grid">
        <!-- Left: Stripe & internal fallback -->
        <section class="pg-card">
            <div class="pg-hdr">Select payment method</div>
            <div class="pg-body">
                <label class="pg-method">
                    <input class="pg-radio" type="radio" name="method" checked />
                    <span>Card Payment <span style="margin-left:8px; opacity:.8;">VISA • MasterCard • JCB</span></span>
                </label>
                <div class="pg-body" style="padding-top:4px;">
                    <div class="pg-row" style="margin:10px 0 12px;">
                        <input id="agree" type="checkbox" />
                        <label for="agree" class="pg-note">I agree to the Personal Data Protection Policy.</label>
                    </div>
                    <div class="pg-actions">
                        <!-- Internal fallback form (server-side payment) -->
                        <form th:action="@{/payment/confirm}" method="post" style="display:inline;">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="orderRef" th:value="${orderRef}" />
                            <button id="payNow" type="submit" class="pg-btn">Pay with Cash</button>
                        </form>
                        <button id="stripePayBtn" class="stripe-btn">Pay with Stripe</button>
                        <a class="btn secondary" th:href="@{/checkout}">Cancel</a>
                    </div>
                    <div class="pg-separator"><span>or</span></div>
                    <p style="font-size:.8rem; color:#6b7280;">Stripe Checkout securely processes your card details.</p>
                </div>
            </div>
        </section>

        <!-- Right: Order summary -->
        <aside class="pg-card pg-order">
            <div class="pg-hdr">Order Information <span style="float:right; font-weight:400; opacity:.7;"></span></div>
            <div class="pg-body">
                <ul>
                    <li><span>Merchant</span><strong th:text="${merchantName}">PIZZA SHOP</strong></li>
                    <table style="width:100%; border-collapse:collapse; margin:8px 0 12px;" th:if="${items != null && !items.isEmpty()}">
                        <thead>
                        <tr>
                            <th style="text-align:left; padding:6px 8px; border-bottom:1px solid #eee;">Item</th>
                            <th style="text-align:center; padding:6px 8px; border-bottom:1px solid #eee; width:60px;">Qty</th>
                            <th style="text-align:right; padding:6px 8px; border-bottom:1px solid #eee; white-space:nowrap;">Item price</th>
                            <th style="text-align:right; padding:6px 8px; border-bottom:1px solid #eee; white-space:nowrap;">Price</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${items}">
                            <td style="padding:6px 8px; border-bottom:1px solid #f1f5f9;" th:text="${i.food != null ? i.food.name : 'Item-' + i.id}">Item name</td>
                            <td style="text-align:center; padding:6px 8px; border-bottom:1px solid #f1f5f9;" th:text="${i.quantity}">1</td>
                            <td style="text-align:right; padding:6px 8px; border-bottom:1px solid #f1f5f9;" th:text="${'$' + #numbers.formatDecimal(i.price, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                            <td style="text-align:right; padding:6px 8px; border-bottom:1px solid #f1f5f9;"
                                th:text="${'$' + #numbers.formatDecimal(i.price.multiply((i.quantity)), 0, 'COMMA', 2, 'POINT')}">$0.00</td>
                        </tr>
                        </tbody>
                    </table>
                    <li class="row"><span>Subtotal</span><strong th:text="${ '$' +#numbers.formatDecimal(subtotal, 0, 'COMMA', 2, 'POINT')}">0đ</strong></li>
                    <li class="row"><span>VAT(10%)</span><span th:text="${ '$' +#numbers.formatDecimal(vat, 0, 'COMMA', 2, 'POINT')}">0đ</span></li>
                    <li class="total"><span>Total</span><strong th:text="${'$' + #numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">$0.00</strong></li>
                </ul>
            </div>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    (function(){
        const stripeBtn = document.getElementById('stripePayBtn');
        const internalBtn = document.getElementById('payNow');
        const agree = document.getElementById('agree');

        // Thymeleaf-injected data
        const publishableKey = /*[[${stripePublishableKey}]]*/ '';
        const orderRef = /*[[${orderRef}]]*/ '';
        const cart = /*[[${cart}]]*/ [];
        // Correct REST endpoint for creating Stripe session (uses @RestController mapped at /api/payment)
        const createSessionUrl = /*[[@{/api/payment/create-session}]]*/ '/api/payment/create-session';

        function logStatus(){
            console.log('[StripePay] publishableKey length:', publishableKey ? publishableKey.length : 0);
            console.log('[StripePay] orderRef:', orderRef);
            console.log('[StripePay] cart items:', Array.isArray(cart)? cart.length : 'not array');
            console.log('[StripePay] createSessionUrl:', createSessionUrl);
        }
        logStatus();

        function syncButtons(){
            const enabled = agree && agree.checked;
            if(internalBtn) internalBtn.disabled = !enabled;
            if(stripeBtn) stripeBtn.disabled = !enabled;
        }
        if(agree){ agree.addEventListener('change', syncButtons); }
        syncButtons();

        if(!stripeBtn){ console.warn('[StripePay] stripePayBtn not found'); return; }

        if(!publishableKey){
            console.error('[StripePay] Missing publishable key. Define stripe.publishable-key in application.properties or env variable.');
            stripeBtn.disabled = true;
            stripeBtn.title = 'Missing Stripe publishable key';
            return;
        }

        let stripe;
        try { stripe = Stripe(publishableKey); } catch(e){
            console.error('[StripePay] Failed to initialize Stripe:', e);
            stripeBtn.disabled = true;
            return;
        }

        stripeBtn.addEventListener('click', function(){
            if(stripeBtn.disabled) return;
            if(!Array.isArray(cart) || cart.length === 0){
                alert('Cart is empty or invalid.');
                return;
            }
            stripeBtn.disabled = true;
            const originalText = stripeBtn.textContent;
            stripeBtn.textContent = 'Creating session...';

            // CSRF handling
            const csrfHeader = document.querySelector('meta[name=_csrf_header]');
            const csrfToken = document.querySelector('meta[name=_csrf]');
            const headers = {
                'Content-Type':'application/json',
                'Accept':'application/json',
                'X-Requested-With':'XMLHttpRequest'
            };
            if(csrfHeader && csrfToken){ headers[csrfHeader.content] = csrfToken.content; }

            // Minimal safe cart projection
            const safeCart = cart.map(i => ({
                name: i.name,
                unitPrice: i.unitPrice,
                quantity: i.quantity,
                currency: i.currency || 'usd'
            }));

            fetch(createSessionUrl, {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin',
                body: JSON.stringify({ cart: safeCart, orderRef: orderRef })
            })
                .then(r => { if(!r.ok) return r.text().then(t => { throw new Error('HTTP ' + r.status + ' ' + t); }); return r.json(); })
                .then(data => {
                    if(!data || !data.id){ throw new Error('Invalid session response'); }
                    console.log('[StripePay] Session created:', data.id);
                    return stripe.redirectToCheckout({ sessionId: data.id });
                })
                .then(result => { if(result && result.error){ throw result.error; } })
                .catch(err => {
                    console.error('[StripePay] Error:', err);
                    alert('Failed to initiate Stripe payment: ' + err.message);
                    stripeBtn.disabled = false;
                    stripeBtn.textContent = originalText;
                });
        });
    })();
    /*]]>*/
</script>
</body>
</html>
