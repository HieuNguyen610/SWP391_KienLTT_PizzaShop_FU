<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop - Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🍕 Pizza Shop</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/menu">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart/view">Giỏ hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="mb-4 text-center">Danh sách Pizza</h2>
    <div class="row" th:if="${#lists.isEmpty(foods)}">
        <p class="text-center">Hiện chưa có pizza nào. Vui lòng quay lại sau.</p>
    </div>

    <div class="row" th:if="${!#lists.isEmpty(foods)}">
        <div class="col-md-4 mb-4" th:each="food : ${foods}">
            <div class="card h-100 shadow-sm">
                <img th:src="${food.imageUrl == null ? '/images/default_pizza.jpg' : food.imageUrl}"
                     class="card-img-top" alt="Pizza Image">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${food.name}">Tên Pizza</h5>
                    <p class="card-text" th:text="${food.description}">Mô tả pizza</p>
                    <p class="fw-bold mt-auto"
                       th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                        100,000 VND
                    </p>
                    <form th:action="@{/add-to-cart}" method="post" class="mt-2">
                        <input type="hidden" name="foodId" th:value="${food.id}" />
                        <input type="number" name="quantity" value="1" min="1" class="form-control mb-2">
                        <button type="submit" class="btn btn-primary w-100">🛒 Thêm vào giỏ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
