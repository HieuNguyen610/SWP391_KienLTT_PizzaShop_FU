<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Pizza Shop</title>
</head>
<body>

<header th:fragment="page_header">
    <!-- Load header styles -->
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css" />
    <nav class="main-nav">
        <div class="logo">
            <a th:href="@{/}"><img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Logo Pizza Shop" style="height: 60px;"></a>
        </div>
        <div class="order-options">
            <button><a th:href="@{/menu}" href="/menu" class="menu-link">Menu</a></button>
            <button><a th:href="@{/profile}" href="/profile" class="menu-link">Profile</a></button>
            <button><a th:href="@{/address}" href="/address" class="menu-link">Address</a></button>
            <button><a th:href="@{/cart}" class="menu-link">Cart</a></button>
        </div>

        <!-- Anonymous user: show login and register links separately -->
        <div class="user-actions" sec:authorize="isAnonymous()" style="display:flex; gap:10px; align-items:center;">
            <a th:href="@{/login}" href="/login" class="login-link">Login</a>
            <a th:href="@{/register}" href="/register" class="register-link">Register</a>
        </div>

        <!-- Authenticated user: show name and logout -->
        <div class="user-actions" sec:authorize="isAuthenticated()" style="display:flex; gap:10px; align-items:center;">
            <span class="user-name" th:text="${currentUser != null ? currentUser.firstname + ' ' + currentUser.lastname : #authentication.getPrincipal().email}">User</span>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-link" style="background:none; border:none; color:#d35400; cursor:pointer;">Logout</button>
            </form>
        </div>
    </nav>
</header>


<footer th:fragment="page_footer" style="text-align: center; padding: 20px; margin-top: 40px; background-color: #f2f2f2;">
    <p>&copy; 2025 Pizza Shop. All Rights Reserved.</p>
    <script src="/js/cart.js"></script>
    <!-- Load paygate behaviors globally; it self-guards by checking elements -->
    <script src="/js/paygate.js"></script>
</footer>

</body>
</html>
