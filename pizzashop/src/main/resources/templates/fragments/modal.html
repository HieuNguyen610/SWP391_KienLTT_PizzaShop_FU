<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="modal">
    <div id="app-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-overlay" data-close></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">Notice</h3>
                <button class="modal-close" type="button" aria-label="Close" data-close>&times;</button>
            </div>
            <div class="modal-body" id="modal-message"></div>
            <div class="modal-footer">
                <button id="modal-cancel" type="button" class="btn secondary">Cancel</button>
                <button id="modal-confirm" type="button" class="btn">OK</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
