<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<body>
<!-- admin sidebar fragment -->
<div th:fragment="sidebar">
    <nav class="admin-sidebar">
        <div class="brand">Pizza Admin</div>
        <div class="user-actions" sec:authorize="isAuthenticated()" style="display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid #ecf0f1; margin-bottom:16px;">
            <span class="user-name" th:text="${currentUser != null ? currentUser.firstname + ' ' + currentUser.lastname : 'User'}">User</span>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-link" style="background:none; border:none; color:#d35400; cursor:pointer;">Logout</button>
            </form>
        </div>

        <ul class="menu">
            <li>
                <a th:classappend="${activeSection}=='dashboard' ? ' active'"
                   th:href="@{/admin}">
                    Dashboard
                </a>
            </li>
            <li>
                <a th:classappend="${activeSection}=='categories' ? ' active'"
                   th:href="@{/admin/categories}">
                    Categories
                </a>
            </li>
            <li>
                <a th:classappend="${activeSection}=='foods' ? ' active'"
                   th:href="@{/admin/foods}">
                    Foods
                </a>
            </li>
            <li>
                <a th:classappend="${activeSection}=='toppings' ? ' active'"
                   th:href="@{/admin/toppings}">
                    Toppings
                </a>
            </li>
            <li>
                <a th:classappend="${activeSection}=='orders' ? ' active'"
                   th:href="@{/admin/orders}">
                    Orders
                </a>
            </li>
            <li>
                <a th:classappend="${activeSection}=='users' ? ' active'"
                   th:href="@{/admin/users}">
                    Users
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
