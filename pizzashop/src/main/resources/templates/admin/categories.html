<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin - Categories</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <link rel="stylesheet" th:href="@{/css/modal.css}" href="/css/modal.css" />
    <link rel="stylesheet" th:href="@{/css/admin-list.css}" href="/css/admin-list.css" />
    <link rel="stylesheet" th:href="@{/css/categories.css}" href="/css/categories.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" href="/css/all.min.css" />
</head>
<body>
<div class="layout">
    <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
    <main>
        <div class="container">
            <h1 class="page-title">Categories</h1>

            <div th:if="${success}" class="card alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="card alert-error" th:text="${error}"></div>

            <div class="toolbar">
                <div class="left">
                    <form th:action="@{/admin/categories}" method="get" class="inline-form">
                        <label for="q" class="visually-hidden">Search by name</label>
                        <input id="q" type="text" name="q" th:value="${q}" placeholder="Search by name..." />
                        <!-- preserve sort/dir when searching -->
                        <input type="hidden" name="sort" th:value="${sort}" />
                        <input type="hidden" name="dir" th:value="${dir}" />
                        <button type="submit" class="btn">Search</button>
                    </form>
                </div>

                <a class="btn" th:href="@{/admin/categories/create}">Add</a>
            </div>

            <div class="card">

                <div th:if="${#lists.isEmpty(categories)}" class="muted">No categories found.</div>
                <table class="table-fixed" th:if="${!#lists.isEmpty(categories)}">
                    <thead>
                    <tr>
                        <th style="width:80px;">
                            <span>ID</span>
                            <span class="sort-icons">
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='id', dir='asc')}" th:classappend="${(sort=='id' and dir=='asc')} ? ' active' : ''" title="Sort ascending">
                                    <i class="fas fa-sort-up"></i>
                                </a>
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='id', dir='desc')}" th:classappend="${(sort=='id' and dir=='desc')} ? ' active' : ''" title="Sort descending">
                                    <i class="fas fa-sort-down"></i>
                                </a>
                            </span>
                        </th>
                        <th style="width:220px;">
                            <span>Name</span>
                            <span class="sort-icons">
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='name', dir='asc')}" th:classappend="${(sort=='name' and dir=='asc')} ? ' active' : ''" title="Sort A→Z">
                                    <i class="fas fa-sort-alpha-up"></i>
                                </a>
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='name', dir='desc')}" th:classappend="${(sort=='name' and dir=='desc')} ? ' active' : ''" title="Sort Z→A">
                                    <i class="fas fa-sort-alpha-down"></i>
                                </a>
                            </span>
                        </th>
                        <th>
                            <span>Description</span>
                            <span class="sort-icons">
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='description', dir='asc')}" th:classappend="${(sort=='description' and dir=='asc')} ? ' active' : ''" title="Sort A→Z">
                                    <i class="fas fa-sort-alpha-up"></i>
                                </a>
                                <a th:href="@{/admin/categories(page=0, q=${q}, sort='description', dir='desc')}" th:classappend="${(sort=='description' and dir=='desc')} ? ' active' : ''" title="Sort Z→A">
                                    <i class="fas fa-sort-alpha-down"></i>
                                </a>
                            </span>
                        </th>
                        <th style="width:140px;">Status</th>
                        <th style="width:160px;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td class="cell-id" th:text="${c.id}"></td>
                        <td>
                            <span class="table-text-ellipsis" th:text="${c.name}" th:title="${c.name}"></span>
                        </td>
                        <td>
                            <span class="table-text-ellipsis" th:if="${c.description == null or #strings.isEmpty(c.description)}">-</span>
                            <span class="table-text-ellipsis" th:if="${c.description != null and not #strings.isEmpty(c.description)}" th:text="${c.description}" th:title="${c.description}"></span>
                        </td>
                        <td class="cell-status">
                            <span th:classappend="${c.isDeleted} ? ' status-deleted' : ' status-active'" class="status-pill" th:text="${c.isDeleted} ? 'Deleted' : 'Active'"></span>
                        </td>
                        <td class="actions-cell text-right">
                            <a class="btn" th:href="@{/admin/categories/{id}/edit(id=${c.id})}">Edit</a>
                            <form th:if="${c.isDeleted == null or c.isDeleted == false}" th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" class="inline-block ml-6" data-confirm="Delete this category?" data-confirm-title="Confirm delete" data-confirm-ok="Delete" data-confirm-cancel="Cancel">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn danger">Delete</button>
                            </form>
                            <button th:if="${c.isDeleted != null and c.isDeleted}" class="btn danger ml-6" disabled>Delete</button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination" th:if="${pageData != null && pageData.totalPages > 1}">
                    <a th:if="${!pageData.first}" th:href="@{/admin/categories(page=${pageData.number - 1}, q=${q}, sort=${sort}, dir=${dir})}">Prev</a>
                    <span th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}" th:classappend="${i == pageData.number} ? 'active' : ''">
                        <a th:if="${i} != ${pageData.number}" th:href="@{/admin/categories(page=${i}, q=${q}, sort=${sort}, dir=${dir})}" th:text="${i + 1}"></a>
                        <span th:if="${i} == ${pageData.number}" th:text="${i + 1}"></span>
                    </span>
                    <a th:if="${!pageData.last}" th:href="@{/admin/categories(page=${pageData.number + 1}, q=${q}, sort=${sort}, dir=${dir})}">Next</a>
                </div>
            </div>

            <div class="right mt-12">
                <span>Total: </span><strong th:text="${pageData != null ? pageData.totalElements : 0}">0</strong>
                <span class="muted ml-8">(10 per page)</span>
            </div>
        </div>
    </main>
</div>

<!-- Reusable modal fragment -->
<div th:replace="fragments/modal :: modal"></div>
<script th:src="@{/js/modal.js}" src="/js/modal.js"></script>
</body>
</html>
