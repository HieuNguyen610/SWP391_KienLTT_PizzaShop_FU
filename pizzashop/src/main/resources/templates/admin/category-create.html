<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create Category</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <link rel="stylesheet" th:href="@{/css/categories.css}" href="/css/categories.css" />
</head>
<body>
<div class="layout">
    <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
    <main>
        <div class="container">
            <h1 class="page-title">Create Category</h1>

            <div th:if="${error}" class="card alert-error" th:text="${error}"></div>

            <div class="card">
                <form th:action="@{/admin/categories/create}" th:object="${categoryForm}" method="post" class="add-form vertical">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="100" placeholder="Category name" required />
                        <div th:if="${#fields.hasErrors('name')}" class="muted" style="color:#991b1b;" th:errors="*{name}"></div>
                    </div>
                    <div class="field wide flex-1">
                        <label for="description">Description</label>
                        <input id="description" type="text" th:field="*{description}" maxlength="255" placeholder="Optional description" />
                        <div th:if="${#fields.hasErrors('description')}" class="muted" style="color:#991b1b;" th:errors="*{description}"></div>
                    </div>
                    <div class="form-actions-row">
                        <button type="submit" class="btn">Create</button>
                        <a th:href="@{/admin/categories}" class="btn secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
