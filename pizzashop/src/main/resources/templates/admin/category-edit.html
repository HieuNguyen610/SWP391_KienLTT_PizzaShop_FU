<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Category</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <style>
        .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .container { max-width: 720px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input[type=text], textarea { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; }
        textarea { min-height:100px; }
        .actions { display:flex; gap:8px; justify-content:flex-end; }
        .btn { background:#2563eb; color:#fff; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; text-decoration:none; }
        .btn.secondary { background:#6b7280; }
        .status-pill { display:inline-block; padding:4px 8px; border-radius:12px; font-size:0.875rem; }
        .status-active { background-color:#d1fae5; color:#065f46; }
        .status-deleted { background-color:#fee2e2; color:#991b1b; }
    </style>
</head>
<body>
<div class="layout">
    <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
    <main>
        <div class="container">
            <h1 style="margin:0 0 16px">Edit Category</h1>
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div>
                        <span>Status: </span>
                        <span th:classappend="${category.isDeleted} ? ' status-deleted' : ' status-active'" class="status-pill" th:text="${category.isDeleted} ? 'Deleted' : 'Active'"></span>
                    </div>
                    <form th:if="${category.isDeleted}" th:action="@{'/admin/categories/' + ${categoryId} + '/restore'}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn">Enable</button>
                    </form>
                </div>
                <form th:action="@{'/admin/categories/' + ${categoryId} + '/edit'}" th:object="${categoryForm}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div>
                        <label for="name">Name</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="100" required />
                        <div th:if="${#fields.hasErrors('name')}" style="color:#991b1b;" th:errors="*{name}"></div>
                    </div>
                    <div style="margin-top:10px;">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" maxlength="255" placeholder="Optional description"></textarea>
                        <div th:if="${#fields.hasErrors('description')}" style="color:#991b1b;" th:errors="*{description}"></div>
                    </div>
                    <div class="actions" style="margin-top:12px;">
                        <a th:href="@{/admin/categories}" class="btn secondary">Cancel</a>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
