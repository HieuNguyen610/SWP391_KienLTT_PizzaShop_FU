<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Category</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    <link rel="stylesheet" th:href="@{/css/admin-style.css}" href="/css/admin-style.css" />
</head>
<body>
<div class="layout">
    <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
    <main>
        <div class="admin-container">
            <h1 style="margin:0 0 16px">Edit Category</h1>
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div>
                        <span>Status: </span>
                        <span th:classappend="${category.isDeleted} ? ' status-deleted' : ' status-active'" class="status-pill" th:text="${category.isDeleted} ? 'Deleted' : 'Active'"></span>
                    </div>
                    <form th:if="${category.isDeleted}" th:action="@{'/admin/categories/' + ${categoryId} + '/restore'}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn">Enable</button>
                    </form>
                </div>
                <form th:action="@{'/admin/categories/' + ${categoryId} + '/edit'}" th:object="${categoryForm}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div>
                        <label for="name">Name</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="100" required />
                        <div th:if="${#fields.hasErrors('name')}" style="color:#991b1b;" th:errors="*{name}"></div>
                    </div>
                    <div style="margin-top:10px;">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" maxlength="255" placeholder="Optional description"></textarea>
                        <div th:if="${#fields.hasErrors('description')}" style="color:#991b1b;" th:errors="*{description}"></div>
                    </div>
                    <div class="actions" style="margin-top:12px;">
                        <a th:href="@{/admin/categories}" class="btn secondary">Cancel</a>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
