<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Food</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css"/>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}" href="/css/admin-style.css"/>
</head>
<body>
    <div class="layout">
        <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
        <main>
        <div class="container">
            <div class="card">
                <h1>Edit food</h1>
                <form th:action="@{'/admin/foods/' + ${foodId} + '/edit'}" th:object="${foodForm}" method="post"
                      enctype="multipart/form-data">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="field">
                        <label for="categoryId">Category</label>
                        <select id="categoryId" th:field="*{categoryId}" required>
                            <option value="" disabled>-- Select category --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('categoryId')}" class="alert-error"
                             th:errors="*{categoryId}"></div>
                    </div>

                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" th:field="*{name}" maxlength="100" required/>
                        <div th:if="${#fields.hasErrors('name')}" class="alert-error" th:errors="*{name}"></div>
                    </div>

                    <div class="field">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}"></textarea>
                        <div th:if="${#fields.hasErrors('description')}" class="alert-error"
                             th:errors="*{description}"></div>
                    </div>

                    <div class="field">
                        <label for="basePrice">Base price</label>
                        <input id="basePrice" type="number" th:field="*{basePrice}" step="0.01" min="0.01" required/>
                        <div th:if="${#fields.hasErrors('basePrice')}" class="alert-error"
                             th:errors="*{basePrice}"></div>
                    </div>

                    <div class="field">
                        <label for="active">Status</label>
                        <select id="active" th:field="*{active}">
                            <option th:value="true">Active</option>
                            <option th:value="false">Inactive</option>
                        </select>
                    </div>

                    <!-- Current image preview -->
                    <div class="field">
                        <label>Current image</label>
                        <div th:if="${#strings.isEmpty(foodForm.imageUrl)}" class="muted">No image</div>
                        <div th:if="${!#strings.isEmpty(foodForm.imageUrl)}" class="image-preview">
                            <img th:if="${#strings.startsWith(foodForm.imageUrl, 'http')}" th:src="${foodForm.imageUrl}"
                                 alt="Current food image"/>
                            <img th:if="${!#strings.startsWith(foodForm.imageUrl, 'http')}"
                                 th:src="@{/{p}(p=${#strings.startsWith(foodForm.imageUrl,'/') ? #strings.substring(foodForm.imageUrl,1) : foodForm.imageUrl})}"
                                 alt="Current food image"/>
                        </div>
                    </div>

                    <!-- Allow changing image via file upload; keep imageUrl editable if switching to external link -->
                    <div class="field">
                        <label for="imageFile">Replace image (optional)</label>
                        <input id="imageFile" type="file" th:field="*{imageFile}" accept="image/*"/>
                        <div class="help">Uploading a new file will replace the current image.</div>
                        <div th:if="${#fields.hasErrors('imageFile')}" class="alert-error"
                             th:errors="*{imageFile}"></div>
                    </div>

                    <div class="field">
                        <label for="imageUrl">Image URL (optional)</label>
                        <input id="imageUrl" type="text" th:field="*{imageUrl}"
                               placeholder="https://... or /uploads/foods/uuid.jpg"/>
                        <div class="help">If provided, this URL will be used; otherwise the uploaded file (if any) is
                            used.
                        </div>
                        <div th:if="${#fields.hasErrors('imageUrl')}" class="alert-error" th:errors="*{imageUrl}"></div>
                    </div>

                    <div class="actions">
                        <a class="btn secondary" th:href="@{/admin/foods}">Cancel</a>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
        </main>
    </div>

<script>
    // Optional: preview newly selected image before submitting
    (function () {
        var input = document.getElementById('imageFile');
        if (!input) return;
        input.addEventListener('change', function (e) {
            var file = e.target.files && e.target.files[0];
            var previewContainer = document.querySelector('.image-preview');
            if (!previewContainer) {
                previewContainer = document.createElement('div');
                previewContainer.className = 'image-preview';
                var field = input.closest('.field');
                if (field) field.parentNode.insertBefore(previewContainer, field);
            }
            if (file) {
                var img = previewContainer.querySelector('img') || document.createElement('img');
                img.onload = function () {
                    URL.revokeObjectURL(img.src);
                };
                img.src = URL.createObjectURL(file);
                if (!previewContainer.contains(img)) previewContainer.appendChild(img);
            }
        });
    })();
</script>
</body>
</html>
