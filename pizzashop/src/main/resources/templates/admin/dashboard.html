<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
</head>
<body>
<div class="layout">
    <aside th:replace="fragments/admin-sidebar :: sidebar"></aside>

    <main>
        <div class="container">
            <h1 class="page-title">Admin dashboard</h1>

            <div th:if="${success}" class="card alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="card alert-error" th:text="${error}"></div>

            <!-- Row 1: Users KPIs -->
            <div class="cards-2">
                <div class="card">
                    <h2>Users</h2>
                    <div class="kpi" th:text="${totalUsers}">0</div>
                    <div class="muted">Total users</div>
                </div>
                <div class="card">
                    <h2>Active users</h2>
                    <div class="kpi" th:text="${activeUsers}">0</div>
                    <div class="muted">Status = ACTIVE</div>
                </div>
            </div>

            <!-- Row 2: Orders and Total revenue KPIs -->
            <div class="cards-2" style="margin-top:16px;">
                <div class="card">
                    <h2>Orders</h2>
                    <div class="kpi" th:text="${totalOrders}">0</div>
                    <div class="muted">Total orders</div>
                </div>
                <div class="card">
                    <h2>Total revenue</h2>
                    <div class="kpi" th:text="|&#36;${#numbers.formatDecimal((totalRevenue != null ? totalRevenue : 0), 1, 'COMMA', 2, 'POINT')}|">0.00</div>
                    <div class="muted">Sum of order total price</div>
                </div>
            </div>

            <div class="grid2">
                <div class="card">
                    <h2>Categories overview</h2>
                    <div th:if="${#lists.isEmpty(categorySummaries)}" class="muted">No categories yet.</div>
                    <table th:if="${!#lists.isEmpty(categorySummaries)}">
                        <thead>
                        <tr>
                            <th>Category</th>
                            <th style="text-align:right;">Foods</th>
                            <th style="text-align:right;">Active foods</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cs : ${categorySummaries}">
                            <td th:text="${cs.categoryName}"></td>
                            <td style="text-align:right;" th:text="${cs.totalFoods}"></td>
                            <td style="text-align:right;" th:text="${cs.activeFoods}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
