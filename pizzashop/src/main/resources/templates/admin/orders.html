<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Management</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" />
    <!-- third party css -->
    <link th:href="@{/libs/datatables/dataTables.bootstrap4.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/libs/datatables/buttons.bootstrap4.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/libs/datatables/responsive.bootstrap4.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/libs/datatables/select.bootstrap4.css}" rel="stylesheet" type="text/css" />

    <!-- App CSS (đổi sang css2) -->
    <link th:href="@{/css2/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet" />
    <link th:href="@{/css2/icons.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/css2/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet" />

</head>
<body class="layout">
<aside th:replace="fragments/admin-sidebar :: sidebar"></aside>
<main class="px-4">

    <div class="row pt-3">
        <div class="col-12">
            <div>
                <h4 class="header-title mb-3">Orders</h4>
            </div>
        </div>
    </div>

    <!-- end row -->


    <div class="row">


        <div class="col-lg-12">
            <div class="card-box">
                <h5 class="mt-0 font-14">Orders Analytics</h5>
                <div class="text-center">
                    <ul class="list-inline chart-detail-list">
                        <li class="list-inline-item">
                            <p class="font-weight-semibold">
                                <i class="fa fa-circle mr-2 text-success"></i>Completed
                            </p>
                        </li>
                        <li class="list-inline-item">
                            <p class="font-weight-semibold">
                                <i class="fa fa-circle mr-2 text-danger"></i>Cancelled
                            </p>
                        </li>
                    </ul>
                </div>
                <div id="sales-line-chart" class="morris-chart" dir="ltr" style="height: 300px;">
                </div>
            </div>
        </div>
        <!-- end col -->
    </div>
    <div class="mb-3">
        <form method="get" action="#" class="row g-2 align-items-end">

            <!-- Order ID + Refresh (chung 1 cột) -->
            <div class="col-md-3">
                <label class="form-label fw-bold">Order ID</label>
                <div class="input-group">
                    <input type="text" name="q" class="form-control"
                           placeholder="Search by Order ID"
                           th:value="${query}">
                    <a th:href="@{/admin/orders}"
                       class="btn btn-outline-secondary"
                       style="padding: 6px 10px;">
                        <i class="fa fa-sync"></i>
                    </a>
                </div>
            </div>

            <!-- Payment Method -->
            <div class="col-md-3">
                <label class="form-label fw-bold">Payment Method</label>
                <select name="payment" class="form-select">
                    <option value="">All Payments</option>
                    <option value="CASH" th:selected="${paymentFilter == 'CASH'}">CASH</option>
                    <option value="CARD" th:selected="${paymentFilter == 'CARD'}">CARD</option>
                    <option value="QRCODE" th:selected="${paymentFilter == 'QRCODE'}">QRCode</option>
                </select>
            </div>

            <!-- Date -->
            <div class="col-md-3">
                <label class="form-label fw-bold">Date</label>
                <input type="date" name="date" class="form-control"
                       th:value="${dateFilter}">
            </div>

            <!-- Status -->
            <div class="col-md-3">
                <label class="form-label fw-bold">Status</label>
                <select name="status" class="form-select">
                    <option value="" th:selected="${statusFilter == ''}">All Status</option>

                    <option value="PAID" th:selected="${statusFilter == 'PAID'}">Paid</option>
                    <option value="COOKING" th:selected="${statusFilter == 'COOKING'}">Cooking</option>
                    <option value="DELIVERING" th:selected="${statusFilter == 'DELIVERING'}">Delivering</option>
                    <option value="COMPLETED" th:selected="${statusFilter == 'COMPLETED'}">Completed</option>
                    <option value="CANCELLED" th:selected="${statusFilter == 'CANCELLED'}">Cancelled</option>
                </select>
            </div>

            <!-- Apply Filters -->
            <div class="col-md-12 mt-3">
                <button class="btn btn-primary w-100" type="submit">Apply Filters</button>
            </div>
        </form>
    </div>



    <div class="row">
        <div class="col-12">
            <div class="mt-5">
                <table id="datatable-buttons"
                       class="table table-striped table-bordered dt-responsive nowrap"
                       style="border-collapse: collapse; border-spacing: 0; width: 100%;">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>User</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Payment Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="order : ${orderPage.content}">
                        <td th:text="'#' + ${order.id}"></td>
                        <td th:text="${order.customerName}"></td>
                        <td th:text="${#numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')} + ' ₫'"></td>
                        <td th:text="${#temporals.format(order.orderTime, 'yyyy-MM-dd HH:mm')}"></td>

                        <!-- Status tag -->
                        <td>
                            <span th:text="${order.status}"
                                  th:style="${order.status == 'COMPLETED'} ?
                                     'background-color:#eaf6ed;color:#28a745;padding:5px 15px;border-radius:20px;font-weight:bold;' :
                                     (order.status == 'DELIVERING' ?
                                     'background-color:#fff5eb;color:#f5a623;padding:5px 15px;border-radius:20px;font-weight:bold;' :
                                     (order.status == 'CANCELLED' ?
                                     'background-color:#fdeaea;color:#dc3545;padding:5px 15px;border-radius:20px;font-weight:bold;' :
                                     'background-color:#e7f3fe;color:#007bff;padding:5px 15px;border-radius:20px;font-weight:bold;'))">
                            </span>
                        </td>

                        <!-- Payment Status -->
                        <td>
                            <span th:text="${order.paymentStatus}"
                                  th:style="${order.paymentStatus == 'PAID'} ?
                                    'color:#28a745;font-weight:bold;' :
                                    'color:#ff9800;font-weight:bold;'"></span>
                        </td>

                        <!-- Details button -->
                        <td>

                            <!-- Details -->
                            <a th:href="@{'/admin/orders/' + ${order.id}}" class="btn btn-primary btn-sm">
                                Details
                            </a>

                            <!-- PAID → COOKING -->
                            <form th:if="${order.status == 'PAID'}"
                                  th:action="@{'/admin/orders/' + ${order.id} + '/update-status'}"
                                  method="post" class="d-inline">

                                <input type="hidden" name="q" th:value="${query}">
                                <input type="hidden" name="payment" th:value="${paymentFilter}">
                                <input type="hidden" name="date" th:value="${dateFilter}">
                                <input type="hidden" name="status" th:value="${statusFilter}">
                                <input type="hidden" name="page" th:value="${currentPage}">

                                <button class="btn btn-warning btn-sm" name="newStatus" value="COOKING">
                                    Start Cooking
                                </button>
                            </form>

                            <!-- COOKING → DELIVERING -->
                            <form th:if="${order.status == 'COOKING'}"
                                  th:action="@{'/admin/orders/' + ${order.id} + '/update-status'}"
                                  method="post" class="d-inline">

                                <input type="hidden" name="q" th:value="${query}">
                                <input type="hidden" name="payment" th:value="${paymentFilter}">
                                <input type="hidden" name="date" th:value="${dateFilter}">
                                <input type="hidden" name="status" th:value="${statusFilter}">
                                <input type="hidden" name="page" th:value="${currentPage}">

                                <button class="btn btn-info btn-sm" name="newStatus" value="DELIVERING">
                                    Delivering
                                </button>
                            </form>

                            <!-- DELIVERING → COMPLETED -->
                            <form th:if="${order.status == 'DELIVERING'}"
                                  th:action="@{'/admin/orders/' + ${order.id} + '/update-status'}"
                                  method="post" class="d-inline">

                                <input type="hidden" name="q" th:value="${query}">
                                <input type="hidden" name="payment" th:value="${paymentFilter}">
                                <input type="hidden" name="date" th:value="${dateFilter}">
                                <input type="hidden" name="status" th:value="${statusFilter}">
                                <input type="hidden" name="page" th:value="${currentPage}">

                                <button class="btn btn-success btn-sm" name="newStatus" value="COMPLETED">
                                    Completed
                                </button>
                            </form>

                            <!-- CANCEL (PAID only) -->
                            <form th:if="${order.status == 'PAID'}"
                                  th:action="@{'/admin/orders/' + ${order.id} + '/cancel'}"
                                  method="post" class="d-inline">

                                <input type="hidden" name="q" th:value="${query}">
                                <input type="hidden" name="payment" th:value="${paymentFilter}">
                                <input type="hidden" name="date" th:value="${dateFilter}">
                                <input type="hidden" name="status" th:value="${statusFilter}">
                                <input type="hidden" name="page" th:value="${currentPage}">

                                <button class="btn btn-outline-danger btn-sm">
                                    Cancel
                                </button>
                            </form>

                        </td>


                    </tr>

                    <!-- Nếu không có order -->
                    <tr th:if="${orderPage.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">No orders found</td>
                    </tr>

                    <!-- Continue for the remaining rows -->
                    </tbody>

                </table>
                <div class="d-flex justify-content-center mt-4" th:if="${orderPage.totalPages > 1}">
                    <nav>
                        <ul class="pagination">

                            <li class="page-item" th:classappend="${orderPage.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{'/admin/orders'(
                        page=${orderPage.number - 1},
                        q=${query},
                        payment=${paymentFilter},
                        date=${dateFilter},
                        status=${statusFilter}
                   )}">
                                    Prev
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, orderPage.totalPages - 1)}"
                                th:classappend="${i == orderPage.number} ? 'active'">
                                <a class="page-link"
                                   th:text="${i + 1}"
                                   th:href="@{'/admin/orders'(
                        page=${i},
                        q=${query},
                        payment=${paymentFilter},
                        date=${dateFilter},
                        status=${statusFilter}
                   )}">
                                </a>
                            </li>

                            <li class="page-item" th:classappend="${orderPage.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{'/admin/orders'(
                        page=${orderPage.number + 1},
                        q=${query},
                        payment=${paymentFilter},
                        date=${dateFilter},
                        status=${statusFilter}
                   )}">
                                    Next
                                </a>
                            </li>

                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/morris.js/0.5.1/morris.min.js"></script>
<script th:src="@{/js2/vendor.min.js}"></script>
<script th:src="@{/js2/pages/custom.init.js}"></script>
<script th:src="@{/js2/app.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const hourlyData = /*[[${hourlyDataJson}]]*/ '[]';
    let parsed = [];

    try {
        parsed = JSON.parse(hourlyData);
        if (!Array.isArray(parsed)) parsed = [];
    } catch (e) {
        console.error("Lỗi parse hourlyData:", e);
        parsed = [];
    }

    Morris.Line({
        element: 'sales-line-chart',
        data: parsed,
        xkey: 'hour',            // 00:00 → 23:00
        ykeys: ['completed', 'cancelled'],
        labels: ['Completed', 'Cancelled'],
        parseTime: false,         // QUAN TRỌNG — không parse thành date
        lineColors: ['#28a745', '#dc3545'],
        lineWidth: 3,
        pointSize: 4,
        hideHover: 'auto',
        resize: true,
        gridLineColor: "rgba(108, 120, 151, 0.1)"
    });
    /*]]>*/
</script>




</body>
</html>
