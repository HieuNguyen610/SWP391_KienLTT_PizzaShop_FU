<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${food != null ? food.name : 'Food details'}">Food details</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/food-detail.css" />
</head>
<body>

<div th:replace="~{fragments/header :: page_header}"></div>

<main class="fd-container">
    <!-- Breadcrumb -->
    <nav class="fd-breadcrumb">
        <a th:href="@{/}">Home</a>
        <span>&gt;</span>
        <a th:href="@{/menu(categoryId=${food.category != null ? food.category.id : null})}" th:text="${food.category != null ? food.category.name : 'Menu'}">Menu</a>
        <span>&gt;</span>
        <span class="current" th:text="${food.name}">Food name</span>
    </nav>

    <div class="fd-grid">
        <!-- Left: Image + short info -->
        <div class="fd-left">
            <div class="fd-image-wrap">
                <img class="fd-image" alt="Food image"
                     th:src="${#strings.isEmpty(food.imageUrl) ? '/images/default_food.jpg' : ((#strings.startsWith(food.imageUrl,'http') or #strings.startsWith(food.imageUrl,'/images/') or #strings.startsWith(food.imageUrl,'images/')) ? food.imageUrl : '/images/' + food.imageUrl)}" />
            </div>
            <div class="fd-basic">
                <h1 class="fd-title" th:text="${food.name}">Food name</h1>
                <div class="fd-price" th:text="${'$' +#numbers.formatDecimal(food.basePrice, 0, 'COMMA', 2, 'POINT')} ">0đ</div>
            </div>
            <div class="fd-desc" th:if="${food.description}">
                <h3>Description</h3>
                <p th:text="${food.description}">Food description...</p>
            </div>
        </div>

        <!-- Right: Purchase panel -->
        <aside class="fd-right">
            <div class="fd-card">
                <h2 class="fd-card-title">Customize item</h2>
                <form>
                    <div class="fd-qty">
                        <label for="qty">Quantity</label>
                        <div class="fd-qty-ctrl">
                            <button type="button" class="fd-btn fd-qty-dec" aria-label="Decrease">−</button>
                            <input id="qty" name="qty" type="number" value="1" min="1" />
                            <button type="button" class="fd-btn fd-qty-inc" aria-label="Increase">+</button>
                        </div>
                    </div>

<!--                    <div>-->
<!--                        <label>Price</label>-->
<!--                        <div class="fd-price" th:text="${ '$' +#numbers.formatDecimal(food.basePrice, 0, 'COMMA', 2, 'POINT')}">0đ</div>-->
<!--                    </div>-->


                    <div class="fd-actions">
                        <button type="button" class="fd-addtocart" th:attr="data-foodid=${food.id}">
                            Add to cart
                        </button>
                        <a class="fd-back" th:href="@{/menu}">Back to menu</a>
                    </div>
                </form>
            </div>

        </aside>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>

<script>
    (function(){
        const dec = document.querySelector('.fd-qty-dec');
        const inc = document.querySelector('.fd-qty-inc');
        const input = document.getElementById('qty');
        if(dec && inc && input){
            dec.addEventListener('click', function(){
                const v = Math.max(1, (parseInt(input.value||'1',10)-1));
                input.value = v;
            });
            inc.addEventListener('click', function(){
                const v = Math.max(1, (parseInt(input.value||'1',10)+1));
                input.value = v;
            });
        }
    })();
</script>

</body>
</html>
