<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: page_header}"></div>

<main>
    <section class="pizza-menu">
        <h2>Danh sách Pizza</h2>

        <!-- Nếu có pizza -->
        <div class="product-grid" th:if="${!#lists.isEmpty(pizzas)}">
            <div class="product-card" th:each="pizza : ${pizzas}">
                <img class="product-image"
                     th:src="${pizza.imageUrl == null ? '/images/product_img_1.jpg' : pizza.imageUrl}"
                     alt="Pizza Image"/>

                <h3 class="product-name" th:text="${pizza.name}">Pizza Name</h3>
                <p class="product-description" th:text="${pizza.description}">Mô tả pizza</p>
                <p class="product-price">Giá:
                    <span th:text="${#numbers.formatDecimal(pizza.basePrice, 0, 'COMMA', 0, 'POINT')}"></span> đ
                </p>

                <!-- Form thêm vào giỏ -->
                <form th:action="@{/cart/add/{id}(id=${pizza.id})}" method="post">
                    <button type="submit" class="buy-now-btn">🛒 Mua ngay</button>
                </form>
            </div>
        </div>

        <!-- Nếu chưa có pizza -->
        <div th:if="${#lists.isEmpty(pizzas)}">
            <p>Hiện chưa có pizza nào trong menu. Vui lòng quay lại sau.</p>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:replace="~{fragments/header :: page_footer}"></div>

</body>
</html>
