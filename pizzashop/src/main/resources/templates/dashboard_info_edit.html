<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

<div th:replace="~{fragments/header :: page_header}"></div>

<main class="profile-page">
    <div class="profile-layout">
        <section class="dashboard_profile_info_edit card section">
            <h2>Edit Information <a th:href="@{/profile}">Cancel</a></h2>

            <!-- Form -->
            <form th:action="@{/profile/edit}" th:object="${editProfileForm}" method="post" class="info_edit_form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row">
                    <div class="col-md-6">
                        <label>
                            <input type="text" th:field="*{firstName}" placeholder="First Name">
                            <span class="error" th:if="${#fields.hasErrors('firstName')}"
                                  th:errors="*{firstName}"></span>
                        </label>
                    </div>

                    <div class="col-md-6">
                        <label>
                            <input type="text" th:field="*{lastName}" placeholder="Last Name">
                            <span class="error" th:if="${#fields.hasErrors('lastName')}"
                                  th:errors="*{lastName}"></span>
                        </label>
                    </div>

                    <div class="col-md-6">
                        <label>
                            <input type="email" th:field="*{email}" placeholder="Email" readonly style="color: gray;">
                        </label>
                    </div>

                    <div class="col-md-6">
                        <label>
                            <input type="text" th:field="*{phone}" placeholder="Phone number">
                            <span class="error" th:if="${#fields.hasErrors('phone')}"
                                  th:errors="*{phone}"></span>
                        </label>
                    </div>

                    <div class="col-md-12">
                        <button type="submit" class="common_btn">Save Profile</button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>

</body>
</html>
