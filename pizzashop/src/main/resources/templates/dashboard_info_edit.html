<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <!-- CSS -->

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/editform.css}">
</head>
<body>

<div th:replace="~{fragments/header :: page_header}"></div>

<main class="profile-page">
    <div class="profile-layout">
        <section class="dashboard_profile_info_edit card section">
            <h2>Edit Information <a th:href="@{/profile}">Cancel</a></h2>

            <!-- Form -->
            <div class="form-container">

                <div class="card-body">
                    <form th:action="@{/profile/edit}" th:object="${editProfileForm}" method="post" class="info_edit_form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row">
                            <!-- First Name -->
                            <div class="col-md-6 form-group"
                                 th:classappend="${#fields.hasErrors('firstName')} ? 'has-error'">
                                <label for="firstName">First Name</label>
                                <input id="firstName" type="text" th:field="*{firstName}"
                                       placeholder="First Name" class="form-control"
                                       pattern="[A-Za-zÀ-ỹ\s]+" title="Only letters and spaces allowed"/>
                                <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>

                            <!-- Last Name -->
                            <div class="col-md-6 form-group"
                                 th:classappend="${#fields.hasErrors('lastName')} ? 'has-error'">
                                <label for="lastName">Last Name</label>
                                <input id="lastName" type="text" th:field="*{lastName}"
                                       placeholder="Last Name" class="form-control"
                                       pattern="[A-Za-zÀ-ỹ\s]+" title="Only letters and spaces allowed"/>
                                <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 form-group">
                                <label for="email">Email</label>
                                <input id="email" type="email" th:field="*{email}" placeholder="Email"
                                       readonly style="color: gray;" class="form-control"/>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6 form-group"
                                 th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                                <label for="phone">Phone</label>
                                <input id="phone" type="text" th:field="*{phone}"
                                       placeholder="Phone number" class="form-control"
                                       pattern="[0-9]{9,11}" title="Only numbers, 9–11 digits"/>
                                <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <!-- Submit -->
                            <div class="col-md-12">
                                <button type="submit" class="common_btn">Save Profile</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>

</body>
</html>
