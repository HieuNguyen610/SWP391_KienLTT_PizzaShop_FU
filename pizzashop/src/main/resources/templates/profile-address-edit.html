<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Delivery Address</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <link rel="stylesheet" th:href="@{/css/profile.css}" href="/css/profile.css" />
    <link rel="stylesheet" th:href="@{/css/profile-address.css}" href="/css/profile-address.css" />
</head>
<body>
<div th:replace="~{fragments/header :: page_header}"></div>

<main class="profile-page">
    <div class="profile-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="card account-box">
                <div class="account-caption">Account of</div>
                <div class="account-name" th:text="${user != null ? user.firstname + ' ' + user.lastname : 'Your Name'}">Your Name</div>
            </div>

            <div class="card">
                <ul class="menu">
                    <li><a th:href="@{/profile}" href="/profile">Customer information</a></li>
                    <li><a class="active" th:href="@{/address}" href="/address">Delivery Address Book</a></li>
                    <li><a th:href="@{/orders}" href="/orders">Order</a></li>
                    <li><a th:href="@{/vouchers}" href="/vouchers">My voucher</a></li>
                </ul>
            </div>
        </aside>

        <!-- Content: Edit Address -->
        <section>
            <div class="card section">
                <div class="card-header">
                    <h2 class="section-title">Edit address</h2>
                    <a class="edit-link" th:href="@{/address}">Back</a>
                </div>
                <div class="card-body">
                    <div th:if="${addrError}" class="alert alert-error" th:text="${addrError}"></div>
                    <div th:if="${addrSuccess}" class="alert alert-success" th:text="${addrSuccess}"></div>

                    <form class="form-grid address-form" th:action="@{'/address/' + ${addr.id} + '/edit'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <label>Full name</label>
                        <input type="text" th:value="${user != null ? user.firstname + ' ' + user.lastname : ''}" readonly style="background:#f3f4f6; color:#6b7280;" />

                        <label class="required" for="province">Province/City</label>
                        <input id="province" name="province" type="text" th:value="${addr.city}" required />

                        <label class="required" for="district">District</label>
                        <input id="district" name="district" type="text" th:value="${addr.district}" required />

                        <label class="required" for="street">Street Name</label>
                        <input id="street" name="street" type="text" th:value="${prefill_street}" required />

                        <label for="number">Number</label>
                        <input id="number" name="number" type="text" th:value="${prefill_number}" />

                        <label for="phone">Phone Number</label>
                        <input id="phone" name="phone" type="tel" th:value="${addr.phone}"
                               maxlength="20"
                               pattern="^[0-9+()\-\s]*$"
                               inputmode="tel"
                               title="Up to 20 characters. Allowed: digits, spaces, +, parentheses, hyphens. 8–15 digits required." />

                        <label></label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="setDefault" th:checked="${addr.defaultAddress}" />
                            <span>Set as default address</span>
                        </label>

                        <div class="form-actions" style="display:flex; gap:12px; align-items:center;">
                            <button type="submit" class="btn-primary">Save</button>
                        </div>
                    </form>

                    <!-- Separate delete form (cannot nest forms) -->
                    <form th:action="@{'/address/' + ${addr.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this address?');" style="margin-top:10px;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" style="background:none; border:1px solid #b91c1c; color:#b91c1c; border-radius:6px; padding:8px 12px; cursor:pointer;">Delete</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>
</body>
</html>
