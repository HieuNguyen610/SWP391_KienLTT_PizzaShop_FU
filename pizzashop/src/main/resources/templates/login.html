<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Pizza Shop</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css" />
</head>
<body>
<div class="container">
    <h2>Login</h2>
    <!-- Success message from registration or verification -->
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/do-login}" th:object="${loginForm}" method="post">
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" th:field="*{email}" id="email" placeholder="Enter your email" required />
            <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" th:field="*{password}" id="password" placeholder="Enter your password" required />
            <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <a href="/register" class="link">Don't have an account? Register</a>
</div>
</body>
</html>
