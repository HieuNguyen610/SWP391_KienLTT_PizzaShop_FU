<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" href="/css/all.min.css" />
</head>
<body>
<div class="container auth-card">
    <h1 class="title">Agent Login</h1>
    <p class="subtitle">Hey, enter your details to sign in to your account</p>

    <div th:if="${success}" class="success" th:text="${success}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/do-login}" th:object="${loginForm}" method="post" autocomplete="on">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" th:field="*{email}" id="email" placeholder="Enter your email" required autocomplete="email" />
            <div th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" th:field="*{password}" id="password" placeholder="Enter your password" required autocomplete="current-password" />
                <button type="button" class="toggle-password" aria-label="Show password">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
        </div>

        <div class="form-row">
            <label class="checkbox">
                <input type="checkbox" name="remember-me" id="remember-me" />
                <span>Remember me</span>
            </label>
            <a href="/forgot-password" class="forgot">Forgot password</a>
        </div>

        <button type="submit" class="btn">Login</button>

        <div class="divider"><span>Or sign in with</span></div>

        <div class="social-buttons">
            <a class="btn-social google" href="/oauth2/authorization/google">
                <img th:src="@{/images/google_icon.svg}" src="/images/google_icon.svg" alt="Google" class="icon" />
                <span>Google</span>
            </a>
        </div>

        <p class="bottom-link">Don't have an account? <a href="/register">Request Now</a></p>
    </form>
</div>

<script>
    (function() {
        var toggle = document.querySelector('.toggle-password');
        if (!toggle) return;
        toggle.addEventListener('click', function() {
            var input = document.getElementById('password');
            var icon = toggle.querySelector('i');
            var showing = input.getAttribute('type') === 'text';
            input.setAttribute('type', showing ? 'password' : 'text');
            if (icon) {
                icon.classList.remove('fa-eye', 'fa-eye-slash');
                icon.classList.add(showing ? 'fa-eye' : 'fa-eye-slash');
                // ensure solid style class present
                icon.classList.add('fas');
            }
            toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
    })();
</script>
</body>
</html>
