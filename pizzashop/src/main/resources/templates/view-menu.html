<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Menu - Pizza Shop</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body>

<div th:replace="~{fragments/header :: page_header}"></div>

<main>
    <section class="menu-page">
        <!-- Top category tabs -->
        <nav class="category-tabs">
            <a href="#">Promotions</a>
            <a href="#">Appetizers</a>
            <a href="#" class="active">Pizza</a>
            <a href="#">Pasta</a>
            <a href="#">Fried Chicken</a>
            <a href="#">Salad</a>
            <a href="#">Baked Pasta</a>
            <a href="#">Drinks</a>
            <a href="#">Combo</a>
        </nav>

        <!-- Filters: search by name and category -->
        <form class="menu-filters" th:action="@{/menu}" method="get">
            <input type="text" name="q" placeholder="Search by name..." th:value="${q}">
            <select id="categorySelect">
                <option value="" th:selected="${categoryId == null}">All categories</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${categoryId != null and cat.id == categoryId}">
                </option>
            </select>
            <!-- hidden mirrors the selection to avoid submitting empty string when 'All categories' -->
            <input type="hidden" name="categoryId" id="categoryIdHidden" th:value="${categoryId}">
            <input type="hidden" name="size" th:value="${page != null ? page.size : 10}">
            <button type="submit">Search</button>
        </form>

        <!-- Simple slider using the same image source as related food items -->
        <div class="slider" aria-label="Featured pizzas">
            <div class="slide" th:each="pizza, iterStat : ${pizzas}" th:if="${iterStat.index} &lt; 6">
                <img th:src="${#strings.isEmpty(pizza.imageUrl) ? '/images/default_food.jpg' : ((#strings.startsWith(pizza.imageUrl,'http') or #strings.startsWith(pizza.imageUrl,'/images/') or #strings.startsWith(pizza.imageUrl,'images/')) ? pizza.imageUrl : '/images/' + pizza.imageUrl)}"
                     alt="Featured Pizza"/>
                <div class="slide-title" th:text="${pizza.name}">Pizza Name</div>
            </div>
            <div th:if="${pizzas == null or pizzas.isEmpty()}">
                <p>No featured items available.</p>
            </div>
        </div>

        <!-- Product grid -->
        <div class="product-grid">
            <div class="product-card" th:each="pizza : ${pizzas}">
                <img class="product-image"
                     th:src="${#strings.isEmpty(pizza.imageUrl) ? '/images/default_food.jpg' : ((#strings.startsWith(pizza.imageUrl,'http') or #strings.startsWith(pizza.imageUrl,'/images/') or #strings.startsWith(pizza.imageUrl,'images/')) ? pizza.imageUrl : '/images/' + pizza.imageUrl)}"
                     alt="Pizza Image"/>

                <h3 class="product-name" th:text="${pizza.name}">Premium Seafood Pizza</h3>
                <p class="product-description" th:text="${pizza.description}">Shrimp, crab, squid, clams and marinara
                    sauce.</p>

                <p class="product-price">Price from only</p>
                <p class="product-price-value"
                   th:text="${#numbers.formatDecimal(pizza.basePrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">154,000đ</p>

                <!-- Actions: share icons (in a row) and add-to-cart button shifted to the right -->
                <div class="product-actions">
                    <div class="share-icons" title="Share with friends">
                        <!-- Simple inline SVG icons to avoid external deps -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M18 8a3 3 0 1 0-2.83-4H8.83A3 3 0 1 0 6 8c0 .34.06.67.16.98L9 12l-2.84 3.02A3 3 0 1 0 9.17 20h6.66A3 3 0 1 0 18 8z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15l-5-3 5-3v6z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 11h-2v2h2v-2zm0-8h-2v6h2V7z"/>
                        </svg>
                    </div>

                    <button class="details_cart_btn" th:attr="data-foodid=${pizza.id}">Add to cart</button>
                </div>

            </div>

            <div th:if="${pizzas == null or pizzas.isEmpty()}">
                <p>Hiện chưa có pizza nào trong menu. Vui lòng quay lại sau.</p>
            </div>
        </div>

        <!-- Pagination controls -->
        <div class="pagination" th:if="${page != null and page.totalPages > 1}">
            <a th:if="${!page.first}"
               th:href="@{/menu(q=${q}, categoryId=${categoryId}, page=${page.number - 1}, size=${page.size})}">&laquo; Prev</a>
            <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                <a th:if="${i != page.number}"
                   th:href="@{/menu(q=${q}, categoryId=${categoryId}, page=${i}, size=${page.size})}"
                   th:text="${i + 1}"></a>
                <span class="current" th:if="${i == page.number}" th:text="${i + 1}"></span>
            </span>
            <a th:if="${!page.last}"
               th:href="@{/menu(q=${q}, categoryId=${categoryId}, page=${page.number + 1}, size=${page.size})}">Next &raquo;</a>
        </div>

    </section>
</main>

<div th:replace="~{fragments/header :: page_footer}"></div>

<script>
(function(){
  var form = document.querySelector('.menu-filters');
  if(form){
    form.addEventListener('submit', function(){
      var sel = document.getElementById('categorySelect');
      var hidden = document.getElementById('categoryIdHidden');
      if(sel && hidden){
        var val = sel.value;
        if(val === '' || val === null){
          // Remove hidden input so categoryId param is not sent at all
          hidden.parentNode && hidden.parentNode.removeChild(hidden);
        } else {
          hidden.value = val;
        }
      }
    });
  }
})();
</script>

</body>
</html>
