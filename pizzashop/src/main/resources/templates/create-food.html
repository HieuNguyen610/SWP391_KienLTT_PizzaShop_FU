<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create Food</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <style>
        .admin-container { max-width: 860px; margin: 32px auto; padding: 24px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .admin-title { margin: 0 0 16px; font-size: 24px; }
        .form-row { display: flex; gap: 16px; }
        .form-group { margin-bottom: 14px; width: 100%; }
        .form-group.half { width: 50%; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type=text], input[type=number], input[type=file], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        textarea { min-height: 100px; }
        .field-error { color: #b91c1c; font-size: 12px; margin-top: 4px; }
        .help { color: #6b7280; font-size: 12px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        .btn { background: #2563eb; border: none; color: white; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
        .btn.secondary { background: #6b7280; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="admin-container">
    <h1 class="admin-title">Add product</h1>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form th:action="@{/food/create}" th:object="${foodForm}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
            <label for="categoryId">Type of product<span style="color:#ef4444"> *</span></label>
            <select id="categoryId" th:field="*{categoryId}" required>
                <option value="" disabled selected>-- Select category --</option>
                <option th:each="cat: ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div th:if="${#fields.hasErrors('categoryId')}" class="field-error" th:errors="*{categoryId}"></div>
        </div>

        <div class="form-group">
            <label for="name">Name <span style="color:#ef4444">*</span></label>
            <input type="text" id="name" th:field="*{name}" placeholder="Name of the food" maxlength="100" required />
            <div th:if="${#fields.hasErrors('name')}" class="field-error" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" placeholder="Write description"></textarea>
            <div th:if="${#fields.hasErrors('description')}" class="field-error" th:errors="*{description}"></div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="basePrice">Base price <span style="color:#ef4444">*</span></label>
                <input type="number" id="basePrice" th:field="*{basePrice}" step="0.01" min="0.01" placeholder="0.00" required />
                <div th:if="${#fields.hasErrors('basePrice')}" class="field-error" th:errors="*{basePrice}"></div>
            </div>
            <div class="form-group half">
                <label for="active">Status</label>
                <select id="active" th:field="*{active}">
                    <option th:value="true">Active</option>
                    <option th:value="false">Inactive</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="imageUrl">Image URL</label>
                <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="https://..." />
                <div class="help">You can provide an external URL or upload a file below.</div>
                <div th:if="${#fields.hasErrors('imageUrl')}" class="field-error" th:errors="*{imageUrl}"></div>
            </div>
            <div class="form-group half">
                <label for="imageFile">Image file</label>
                <input type="file" id="imageFile" th:field="*{imageFile}" accept="image/*" />
                <div th:if="${#fields.hasErrors('imageFile')}" class="field-error" th:errors="*{imageFile}"></div>
            </div>
        </div>

        <!-- Placeholder blocks to resemble mockup; real Size/Base/Ingredient modeling can be added later -->
        <div class="form-group">
            <label>Size</label>
            <div class="help">Variants by size will be supported later.</div>
        </div>
        <div class="form-group">
            <label>Base</label>
            <div class="help">Variants by base/crust will be supported later.</div>
        </div>
        <div class="form-group">
            <label>Ingredient</label>
            <div class="help">Ingredient selection will be supported later.</div>
        </div>

        <div class="actions">
            <a class="btn secondary" th:href="@{/static}">Cancel</a>
            <button type="submit" class="btn">Add</button>
        </div>
    </form>
</div>

<script>
    (function(){
        const url = document.getElementById('imageUrl');
        const file = document.getElementById('imageFile');
        function sync() {
            // simple UX: if URL typed, disable file; if file selected, disable URL
            if (url && file) {
                file.disabled = !!(url.value && url.value.trim().length > 0);
                url.disabled = !!(file.files && file.files.length > 0);
            }
        }
        if (url) url.addEventListener('input', sync);
        if (file) file.addEventListener('change', sync);
        sync();
    })();
</script>
</body>
</html>
