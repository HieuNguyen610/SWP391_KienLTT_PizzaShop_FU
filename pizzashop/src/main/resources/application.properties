# Server Port Configuration
server.port=8080

# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/pizza_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Ngoc3008@

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging for troubleshooting authentication/redirect flow
logging.level.com.swp.pizzashop=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO

logging.level.org.springframework.transaction=error
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=error

# Show error messages in responses during debug
server.error.include-message=always

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Message bundle basename (Spring will look for messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8


# Max delivery addresses a user can save
pizzashop.address.max-per-user=3

# --- File upload configuration ---
# Directory on disk to store uploaded files (default resolves to <project_root>/src/main/resources/static/images/upload)
# On Windows you can set an absolute path like: C:/pizzashop_uploads
pizzashop.uploads.dir=${PIZZASHOP_UPLOADS_DIR:${user.dir}/src/main/resources/static/images/upload}

# Max upload sizes (adjust as needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Max allowed image size for our storage service (in bytes). Default 5MB if not set.
# pizzashop.uploads.max-size-bytes=5242880

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
