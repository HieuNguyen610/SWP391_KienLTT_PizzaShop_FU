# Server Port Configuration
server.port=8080

# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/mydb
spring.datasource.username=myuser
spring.datasource.password=mypass

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging for troubleshooting authentication/redirect flow
logging.level.com.swp.pizzashop=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO

logging.level.org.springframework.transaction=error
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=error

# Show error messages in responses during debug
server.error.include-message=always

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Message bundle basename (Spring will look for messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Mail configuration (placeholder for dev; replace in production) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# If you later use a real SMTP (e.g., Gmail / SendGrid), set auth=true and enable STARTTLS as needed

# Max delivery addresses a user can save
pizzashop.address.max-per-user=3

# --- File upload configuration ---
# Directory on disk to store uploaded files (default resolves to <project_root>/src/main/resources/static/images/upload)
# On Windows you can set an absolute path like: C:/pizzashop_uploads
pizzashop.uploads.dir=${PIZZASHOP_UPLOADS_DIR:${user.dir}/src/main/resources/static/images/upload}

# Max upload sizes (adjust as needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Max allowed image size for our storage service (in bytes). Default 5MB if not set.
# pizzashop.uploads.max-size-bytes=5242880

# --- Stripe configuration ---
# Set these via environment variables in dev/prod
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_change_me}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_change_me}
# Used to construct success/cancel URLs; in production set to your public base URL
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
stripe.success-url=${app.base-url}/payment/stripe-success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=${app.base-url}/payment/stripe-cancel